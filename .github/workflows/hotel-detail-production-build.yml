name: Build hotel detail production payload

on:
  push:
    branches:
      - feature/hotel-detail-research-20260808
    paths:
      - .github/workflows/hotel-detail-production-build.yml

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/hotel-detail-research-20260808

      - name: Read final research dataset from research branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/hotel-details-750-20260807 --depth=1
          git show origin/research/hotel-details-750-20260807:research/generated/hotel_detail_research_750.jsonl > /tmp/hotel_detail_research_750.jsonl
          test "$(wc -l < /tmp/hotel_detail_research_750.jsonl)" -eq 750

      - name: Build production hotel detail payload
        run: |
          python scripts/build_hotel_details_production.py \
            --research /tmp/hotel_detail_research_750.jsonl \
            --hotels assets/data/hotels.json \
            --output assets/data/hotel-details.json \
            --validation research/generated/hotel_details_production_validation.json

      - name: Connect enhanced detail UI and apply approved mobile polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('assets/js/app.js')
          text = app.read_text(encoding='utf-8')
          style_anchor = '  appendStylesheet("assets/css/finder-single-select.css?v=20260806-1", "finder-two-step-style");'
          style_line = '  appendStylesheet("assets/css/hotel-detail.css?v=20260808-1", "hotel-detail-style");'
          if style_line not in text:
              if style_anchor not in text:
                  raise SystemExit('app.js stylesheet anchor not found')
              text = text.replace(style_anchor, style_anchor + '\n' + style_line, 1)

          old = '  core.onload = applyTopRefresh;'
          new = '''  core.onload = () => {
            applyTopRefresh();
            if (document.querySelector("script[data-hotel-detail-script]")) return;
            const detail = document.createElement("script");
            detail.src = "assets/js/hotel-detail.js?v=20260808-1";
            detail.async = false;
            detail.dataset.hotelDetailScript = "";
            detail.onerror = () => console.error("Hotel detail enhancement could not be loaded.");
            document.head.append(detail);
          };'''
          if 'data-hotel-detail-script' not in text:
              if old not in text:
                  raise SystemExit('app.js core.onload anchor not found')
              text = text.replace(old, new, 1)
          app.write_text(text, encoding='utf-8')

          js = Path('assets/js/hotel-detail.js')
          text = js.read_text(encoding='utf-8')
          old = '''    const badge = el("span", "hd-mode-badge", modeLabel(access.mode));
            card.append(copy, badge);
            if (access.note) card.append(el("p", "hd-access__note", access.note));
            return card;'''
          new = '''    const badge = el("span", "hd-mode-badge", modeLabel(access.mode));
            card.append(copy, badge);

            const facts = el("div", "hd-access-facts");
            const addFact = (label, value) => {
              if (!value) return;
              const item = el("div", "hd-access-fact");
              item.append(el("span", "hd-access-fact__label", label), el("strong", "", value));
              facts.append(item);
            };
            if (Number.isFinite(access.hotelWalkMin) && access.hotelStation) addFact(`${access.hotelStation}駅まで`, `徒歩${access.hotelWalkMin}分`);
            if (Number.isFinite(access.transferCount)) addFact("乗換", `${access.transferCount}回`);
            if (access.venueStation) addFact("会場最寄り", `${access.venueStation}駅`);
            if (Number.isFinite(access.venueWalkMin)) addFact("駅から会場", `徒歩${access.venueWalkMin}分`);
            if (facts.childElementCount) card.append(facts);

            if (access.note) card.append(el("p", "hd-access__note", access.note));
            return card;'''
          if 'hd-access-facts' not in text:
              if old not in text:
                  raise SystemExit('hotel-detail.js access hero anchor not found')
              text = text.replace(old, new, 1)

          old_order = '''    const stay = renderStay(detail);
            if (stay) shell.append(stay);

            const fit = renderFit(detail);
            if (fit) shell.append(fit);'''
          new_order = '''    const fit = renderFit(detail);
            if (fit) shell.append(fit);

            const stay = renderStay(detail);
            if (stay) shell.append(stay);'''
          if old_order in text:
              text = text.replace(old_order, new_order, 1)
          js.write_text(text, encoding='utf-8')

          css = Path('assets/css/hotel-detail.css')
          text = css.read_text(encoding='utf-8')
          insert_before = '.hd-access__note {'
          facts_css = '''.hd-access-facts {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
          }

          .hd-access-fact {
            min-width: 0;
            padding: 10px 11px;
            display: grid;
            gap: 3px;
            border: 1px solid color-mix(in srgb, var(--category) 18%, var(--border));
            border-radius: 10px;
            background: rgba(255,255,255,.74);
          }

          .hd-access-fact__label {
            overflow: hidden;
            color: var(--muted);
            font-size: .68rem;
            font-weight: 700;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .hd-access-fact strong {
            overflow-wrap: anywhere;
            color: var(--text);
            font-size: .82rem;
            line-height: 1.35;
          }

          '''
          if '.hd-access-facts {' not in text:
              if insert_before not in text:
                  raise SystemExit('hotel-detail.css access note anchor not found')
              text = text.replace(insert_before, facts_css + insert_before, 1)

          mobile_anchor = '''  .hd-access__limited-title {
              font-size: 1.45rem;
            }
          '''
          mobile_facts = '''  .hd-access-facts {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 7px;
            }

            .hd-access-fact {
              padding: 9px 10px;
            }

          '''
          if '@media (max-width: 767px)' in text and 'grid-template-columns: repeat(2, minmax(0, 1fr));\n              gap: 7px;' not in text:
              if mobile_anchor not in text:
                  raise SystemExit('hotel-detail.css mobile facts anchor not found')
              text = text.replace(mobile_anchor, mobile_anchor + '\n' + mobile_facts, 1)

          old_mobile_actions = '''  .hd-actions {
              margin: 20px -16px 0;
              padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
              grid-template-columns: 1fr;
            }

            .hd-actions__booking {
              grid-template-columns: 1fr;
            }
          '''
          new_mobile_actions = '''  .hd-actions {
              margin: 20px -16px 0;
              padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
              grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
              align-items: stretch;
            }

            .hd-actions__booking {
              grid-template-columns: 1fr;
            }

            .hd-actions__booking .button:nth-child(n+2) {
              display: none;
            }

            .hd-actions:has(.hd-actions__booking:empty) {
              grid-template-columns: 1fr;
            }
          '''
          if old_mobile_actions in text:
              text = text.replace(old_mobile_actions, new_mobile_actions, 1)
          css.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and production data
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/hotel-detail.js
          python -m py_compile scripts/build_hotel_details_production.py
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('assets/data/hotel-details.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('research/generated/hotel_details_production_validation.json').read_text(encoding='utf-8'))
          base = json.loads(Path('assets/data/hotels.json').read_text(encoding='utf-8'))['hotels']
          records = payload.get('records') or {}

          assert payload.get('recordCount') == 750, payload.get('recordCount')
          assert len(records) == 750, len(records)
          assert len(set(records)) == 750
          assert validation['researchRows'] == 750
          assert validation['researchUniqueIds'] == 750
          assert validation['researchStatusCounts'].get('needs_review', 0) == 0
          assert validation['researchStatusCounts'].get('verified', 0) == 672, validation['researchStatusCounts']
          assert validation['researchStatusCounts'].get('partial', 0) == 78, validation['researchStatusCounts']
          assert validation['coverageCounts'].get('complete', 0) == 672
          assert validation['coverageCounts'].get('limited', 0) == 78
          assert not validation['missingBaseHotelIds'], validation['missingBaseHotelIds']
          base_ids = {row.get('id') for row in base}
          assert set(records).issubset(base_ids)

          forbidden = ('verification_status', 'warnings')
          serialized = json.dumps(payload, ensure_ascii=False)
          assert all(token not in serialized for token in forbidden)
          for item in records.values():
              if item.get('coverage') == 'limited':
                  assert item.get('access', {}).get('heroMin') is None
              assert item.get('checkedAt')

          app = Path('assets/js/app.js').read_text(encoding='utf-8')
          detail_js = Path('assets/js/hotel-detail.js').read_text(encoding='utf-8')
          detail_css = Path('assets/css/hotel-detail.css').read_text(encoding='utf-8')
          assert 'assets/css/hotel-detail.css?v=20260808-1' in app
          assert 'assets/js/hotel-detail.js?v=20260808-1' in app
          assert 'hd-access-facts' in detail_js
          assert 'hd-access-facts' in detail_css
          assert 'detail-visual' not in detail_js
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/js/hotel-detail.js assets/css/hotel-detail.css assets/data/hotel-details.json research/generated/hotel_details_production_validation.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Integrate validated 750 hotel detail records"
          git push origin HEAD:feature/hotel-detail-research-20260808
