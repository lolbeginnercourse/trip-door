name: Patch root OGP metadata

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  patch-root-ogp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted main branch only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Insert OGP directly into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<!-- STAYSCENE SOCIAL CARD -->'

          if marker not in text:
              anchor = '  <title>STAYSCENE｜イベント遠征のホテル選び</title>'
              if anchor not in text:
                  raise SystemExit('Expected title anchor not found in index.html')

              block = '''  <!-- STAYSCENE SOCIAL CARD -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="STAYSCENE">
  <meta property="og:title" content="STAYSCENE｜遠征・おでかけのホテル選び">
  <meta property="og:description" content="遠征やおでかけのホテルを、移動や滞在中の過ごし方から比較できるホテル選びガイドです">
  <meta property="og:url" content="https://mainitiworakunisuru.com/">
  <meta property="og:image" content="https://mainitiworakunisuru.com/assets/images/stayscene-og.jpg?v=20260809-2053">
  <meta property="og:image:secure_url" content="https://mainitiworakunisuru.com/assets/images/stayscene-og.jpg?v=20260809-2053">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:alt" content="STAYSCENE｜遠征・おでかけのホテル選び">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="STAYSCENE｜遠征・おでかけのホテル選び">
  <meta name="twitter:description" content="遠征やおでかけのホテルを、移動や滞在中の過ごし方から比較できるホテル選びガイドです">
  <meta name="twitter:image" content="https://mainitiworakunisuru.com/assets/images/stayscene-og.jpg?v=20260809-2053">
  <meta name="twitter:image:alt" content="STAYSCENE｜遠征・おでかけのホテル選び">'''

              text = text.replace(anchor, anchor + '\n' + block, 1)
              index.write_text(text, encoding='utf-8')

          vercel = Path('vercel.json')
          data = json.loads(vercel.read_text(encoding='utf-8'))
          routes = data.get('routes', [])
          data['routes'] = [
              route for route in routes
              if not (
                  route.get('dest') == '/og.html'
                  and any(
                      item.get('type') == 'header' and item.get('key', '').lower() == 'user-agent'
                      for item in route.get('has', [])
                  )
              )
          ]
          vercel.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit direct OGP metadata to main
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html vercel.json
          git commit -m "Add OGP metadata directly to root page"
          git push origin HEAD:main
