name: Jalan 748 PR add-only verified runner

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.ref == 'jalan-748-pr-runner-final-config-20260808'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fill only empty Jalan links from verified 748 source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const crypto = require('crypto');

          const dbPath = 'assets/data/hotels.json';
          const nameParts = [
            ['.github/tmp/jalan-748-names-01.br64', 'e8180664fce3d74f538746d2a56b942bf4c37768'],
            ['.github/tmp/jalan-748-names-02.br64', '349aa5c63830fe15a349d073155f2d143f167f0c'],
            ['.github/tmp/jalan-748-names-03.br64', '39d422806556dc2fa77db3a99d3b6f46c64af7a6'],
            ['.github/tmp/jalan-748-names-04.br64', '68c0f6773939a50b60fb9b45fd42cfcd69659652'],
          ];
          const expectedSourceDigest = '30777e9bba54aa09ef3e84f61d7527e79043da3a09bd8ad82073a3ac07eeee27';

          const gitBlobSha = text => {
            const body = Buffer.from(text, 'utf8');
            return crypto.createHash('sha1')
              .update(Buffer.concat([Buffer.from(`blob ${body.length}\0`), body]))
              .digest('hex');
          };

          const names = [];
          for (const [path, expectedSha] of nameParts) {
            const encoded = fs.readFileSync(path, 'utf8').trim();
            const actualSha = gitBlobSha(encoded);
            if (actualSha !== expectedSha) throw new Error(`Source chunk hash mismatch: ${path}: ${actualSha}`);
            const decoded = JSON.parse(
              zlib.brotliDecompressSync(Buffer.from(encoded, 'base64')).toString('utf8')
            );
            if (!Array.isArray(decoded)) throw new Error(`Source chunk is not an array: ${path}`);
            names.push(...decoded);
          }
          if (names.length !== 748) throw new Error(`Source name count mismatch: ${names.length}`);

          const norm = value => String(value ?? '')
            .normalize('NFKC')
            .replace(/[\u00a0\u3000]/g, ' ')
            .replace(/\s+/gu, ' ')
            .trim()
            .toLowerCase();
          const compact = value => norm(value).replace(/\s+/gu, '');
          const normalizedNames = new Set(names.map(norm));
          if (normalizedNames.size !== 748) throw new Error(`Source names are not unique after normalization: ${normalizedNames.size}`);

          const directTargets = new Map([
            ['東横INN品川港南口天王洲アイル', 'https://www.jalan.net/yad390736/plan/'],
            ['ANAホリデイ・イン東京ベイ', 'https://www.jalan.net/yad349696/plan/'],
            ['ダイワロイネットホテル新橋', 'https://www.jalan.net/yad344290/plan/'],
            ['ホテルリブマックス東京綾瀬駅前', 'https://www.jalan.net/yad359437/plan/'],
            ['アパホテル〈浅草 田原町駅前〉', 'https://www.jalan.net/yad347008/plan/'],
            ['JR東日本ホテルメッツ 立川', 'https://www.jalan.net/yad344920/plan/'],
            ['ホテルメトロポリタン 羽田', 'https://www.jalan.net/yad308818/plan/'],
            ['ダブルツリーbyヒルトン東京有明', 'https://www.jalan.net/yad316041/'],
          ]);

          const referralFor = name => {
            const target = directTargets.get(name) ||
              `https://www.jalan.net/uw/uwp2011/uww2011init.do?activeSort=0&keyword=${encodeURIComponent(name)}`;
            return `https://ck.jp.ap.valuecommerce.com/servlet/referral?sid=3777400&pid=892672227&vc_url=${encodeURIComponent(target)}`;
          };

          const mapping = names.map(name => ({name, url: referralFor(name)}));
          const sourceDigest = crypto.createHash('sha256')
            .update(mapping.map(x => `${x.name}\0${x.url}\n`).join(''), 'utf8')
            .digest('hex');
          if (sourceDigest !== expectedSourceDigest) {
            throw new Error(`Reconstructed source digest mismatch: ${sourceDigest}`);
          }

          for (const item of mapping) {
            const u = new URL(item.url);
            const vc = u.searchParams.get('vc_url');
            if (u.protocol !== 'https:' || u.hostname !== 'ck.jp.ap.valuecommerce.com' || u.pathname !== '/servlet/referral' || !vc) {
              throw new Error(`Invalid ValueCommerce URL: ${item.name}`);
            }
            if (u.searchParams.get('sid') !== '3777400' || u.searchParams.get('pid') !== '892672227') {
              throw new Error(`Affiliate account mismatch: ${item.name}`);
            }
            const target = new URL(vc);
            if (target.protocol !== 'https:' || target.hostname !== 'www.jalan.net') {
              throw new Error(`Non-Jalan target: ${item.name}`);
            }
          }

          const raw = fs.readFileSync(dbPath, 'utf8');
          const before = JSON.parse(raw);
          const data = JSON.parse(raw);
          const getRows = obj => Array.isArray(obj)
            ? obj
            : Array.isArray(obj.hotels) ? obj.hotels
            : Array.isArray(obj.data) ? obj.data
            : Array.isArray(obj.items) ? obj.items
            : null;
          const rows = getRows(data);
          const beforeRows = getRows(before);
          if (!rows || !beforeRows || rows.length !== beforeRows.length) throw new Error('Hotel rows not found or changed');

          const candidateKeys = ['name', 'hotelName', 'hotel_name'];
          const scores = candidateKeys.map(key => {
            const vals = new Set(rows.filter(r => r && typeof r[key] === 'string').map(r => norm(r[key])));
            return {key, score: mapping.filter(item => vals.has(norm(item.name))).length};
          }).sort((a,b) => b.score - a.score);
          const nameKey = scores[0].key;
          if (!scores[0].score) throw new Error(`No hotel-name key matched: ${JSON.stringify(scores)}`);

          const rowIndex = new WeakMap();
          rows.forEach((r, i) => { if (r && typeof r === 'object') rowIndex.set(r, i); });
          const buildIndex = fn => {
            const out = new Map();
            for (const row of rows) {
              if (!row || typeof row[nameKey] !== 'string') continue;
              const key = fn(row[nameKey]);
              if (!out.has(key)) out.set(key, []);
              out.get(key).push(row);
            }
            return out;
          };
          const rawMap = buildIndex(v => v);
          const normMap = buildIndex(norm);
          const compactMap = buildIndex(compact);
          const distinctRawNames = candidates => [...new Set(candidates.map(r => r[nameKey]))];
          const hasExistingJalan = value => typeof value === 'string' && value.trim().length > 0;

          let exactUnique = 0, normalizedUnique = 0, compactUnique = 0;
          let matchedRows = 0, filledBlankRows = 0, preservedExistingRows = 0;
          const matched = [], unmatched = [], ambiguous = [], filled = [], filledFacilityNames = new Set();

          for (const item of mapping) {
            let candidates = rawMap.get(item.name) || [];
            let mode = 'exact';
            if (!candidates.length) {
              candidates = normMap.get(norm(item.name)) || [];
              mode = 'normalized';
              if (candidates.length && distinctRawNames(candidates).length !== 1) {
                ambiguous.push({source:item.name, mode, candidates:distinctRawNames(candidates)});
                continue;
              }
            }
            if (!candidates.length) {
              candidates = compactMap.get(compact(item.name)) || [];
              mode = 'compact-whitespace';
              if (candidates.length && distinctRawNames(candidates).length !== 1) {
                ambiguous.push({source:item.name, mode, candidates:distinctRawNames(candidates)});
                continue;
              }
            }
            if (!candidates.length) {
              unmatched.push(item.name);
              continue;
            }

            matched.push(item.name);
            if (mode === 'exact') exactUnique++;
            else if (mode === 'normalized') normalizedUnique++;
            else compactUnique++;
            matchedRows += candidates.length;

            for (const row of candidates) {
              const i = rowIndex.get(row);
              if (hasExistingJalan(row.jalan)) {
                preservedExistingRows++;
                continue;
              }
              row.jalan = item.url;
              filledBlankRows++;
              filledFacilityNames.add(item.name);
              filled.push({index:i, source:item.name, url:item.url});
            }
          }

          if (ambiguous.length) throw new Error(`Ambiguous matches: ${JSON.stringify(ambiguous)}`);

          const stripJalan = value => {
            if (Array.isArray(value)) return value.map(stripJalan);
            if (value && typeof value === 'object') {
              const out = {};
              for (const [k,v] of Object.entries(value)) if (k !== 'jalan') out[k] = stripJalan(v);
              return out;
            }
            return value;
          };
          if (JSON.stringify(stripJalan(before)) !== JSON.stringify(stripJalan(data))) {
            throw new Error('A non-Jalan field changed');
          }

          for (let i = 0; i < rows.length; i++) {
            if (hasExistingJalan(beforeRows[i]?.jalan) && rows[i]?.jalan !== beforeRows[i].jalan) {
              throw new Error(`Existing Jalan link changed at row ${i}`);
            }
          }
          for (const f of filled) {
            if (rows[f.index]?.jalan !== f.url) throw new Error(`Filled URL verification failed at row ${f.index}: ${f.source}`);
          }

          fs.writeFileSync(dbPath, JSON.stringify(data));
          const verify = JSON.parse(fs.readFileSync(dbPath, 'utf8'));
          const verifyRows = getRows(verify);
          if (JSON.stringify(stripJalan(before)) !== JSON.stringify(stripJalan(verify))) throw new Error('Post-write non-Jalan mismatch');
          for (let i = 0; i < verifyRows.length; i++) {
            if (hasExistingJalan(beforeRows[i]?.jalan) && verifyRows[i]?.jalan !== beforeRows[i].jalan) {
              throw new Error(`Post-write existing Jalan changed at row ${i}`);
            }
          }
          for (const f of filled) {
            if (verifyRows[f.index]?.jalan !== f.url) throw new Error(`Post-write filled URL mismatch at row ${f.index}`);
          }

          const report = {
            mode: 'add-only-empty-jalan',
            sourceEntries: 748,
            sourceDigestVerified: true,
            dbRows: rows.length,
            nameKey,
            scores,
            matchedUnique: matched.length,
            exactUnique,
            normalizedUnique,
            compactWhitespaceUnique: compactUnique,
            matchedRows,
            filledBlankRows,
            filledUniqueFacilities: filledFacilityNames.size,
            preservedExistingRows,
            unmatchedCount: unmatched.length,
            unmatched,
            ambiguousCount: ambiguous.length,
            ambiguous,
            nonJalanFieldsIdentical: true,
            existingJalanLinksPreserved: true
          };
          fs.writeFileSync('/tmp/jalan-report.json', JSON.stringify(report, null, 2));
          console.log('JALAN_748_REPORT_START');
          console.log(JSON.stringify(report, null, 2));
          console.log('JALAN_748_REPORT_END');
          NODE
          cat /tmp/jalan-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Commit clean result branch
        shell: bash
        run: |
          rm -f .github/tmp/jalan-748-map.br64
          rm -f .github/tmp/jalan-748-map-part-*.br64
          rm -f .github/tmp/jalan-748-names-*.br64
          rm -f .github/tmp/jalan-748-trigger.txt
          rm -f .github/workflows/jalan-748-update.yml
          rm -f .github/workflows/jalan-748-final.yml
          rm -f .github/workflows/jalan-748-pr-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b jalan-affiliate-748-add-only-result-20260808
          git add -A -- assets/data/hotels.json .github/tmp .github/workflows
          git commit -m "Fill empty Jalan affiliate links from verified 748 source"
          git push origin HEAD:jalan-affiliate-748-add-only-result-20260808
