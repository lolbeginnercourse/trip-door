name: Resume full hotel image audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/resume-all-hotel-image-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/all-hotel-image-coverage-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run full 1,256-record audit
        env:
          IMAGE_INTERVAL_MS: "1150"
          AFFILIATE_INTERVAL_MS: "1700"
        run: node scripts/audit-all-hotel-images.mjs
      - name: Save audit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/all-hotel-image-audit-20260807
          git rm -f .github/workflows/audit-all-hotel-images.yml
          git commit -m "Complete full hotel image coverage audit"
          git push origin HEAD:audit/all-hotel-image-coverage-20260807
      - name: Remove temporary runner from main
        if: always()
        shell: bash
        run: |
          git fetch origin main
          git switch -C main origin/main
          git rm -f .github/workflows/resume-all-hotel-image-audit.yml
          git commit -m "Remove completed hotel image audit runner"
          git push origin main
