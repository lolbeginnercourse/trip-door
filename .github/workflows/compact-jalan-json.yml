name: Compact and verify Jalan hotel JSON

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'jalan-format-cleanup-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Fetch pre-change backup
        shell: bash
        run: git fetch origin backup-before-jalan-link-update-20260808-1834 --depth=1

      - name: Verify only Jalan fields changed
        shell: bash
        run: |
          git show FETCH_HEAD:assets/data/hotels.json > /tmp/hotels-before.json
          python3 - <<'PY'
          import copy, json, urllib.parse
          from pathlib import Path

          before = json.loads(Path('/tmp/hotels-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('assets/data/hotels.json').read_text(encoding='utf-8'))

          if len(before.get('hotels', [])) != len(after.get('hotels', [])):
              raise SystemExit('Hotel row count changed')

          def strip_jalan(doc):
              doc = copy.deepcopy(doc)
              for hotel in doc.get('hotels', []):
                  if isinstance(hotel, dict):
                      hotel.pop('jalan', None)
              return doc

          if strip_jalan(before) != strip_jalan(after):
              raise SystemExit('Safety failure: a non-Jalan semantic field changed')

          changes = []
          for old, new in zip(before['hotels'], after['hotels']):
              old_url = old.get('jalan') if isinstance(old, dict) else None
              new_url = new.get('jalan') if isinstance(new, dict) else None
              if old_url != new_url:
                  decoded = urllib.parse.unquote(str(new_url or '')).lower()
                  if not str(new_url or '').startswith('https://ck.jp.ap.valuecommerce.com/servlet/referral?'):
                      raise SystemExit(f'Changed Jalan URL is not ValueCommerce affiliate URL: {new.get("name")}')
                  if 'www.jalan.net/yad' not in decoded:
                      raise SystemExit(f'Changed Jalan URL does not target a Jalan hotel page: {new.get("name")}')
                  changes.append((new.get('name'), old_url, new_url))

          if len(changes) != 800:
              raise SystemExit(f'Expected exactly 800 changed Jalan rows, got {len(changes)}')

          replaced = sum(1 for _, old, _ in changes if old)
          added = sum(1 for _, old, _ in changes if not old)
          print('NON_JALAN_FIELDS_IDENTICAL=true')
          print('JALAN_CHANGED_ROWS=' + str(len(changes)))
          print('JALAN_REPLACED_ROWS=' + str(replaced))
          print('JALAN_ADDED_ROWS=' + str(added))
          PY

      - name: Restore compact JSON formatting
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'assets/data/hotels.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          fs.writeFileSync(path, JSON.stringify(data), 'utf8');
          NODE

      - name: Commit formatting only if needed
        shell: bash
        run: |
          if git diff --quiet -- assets/data/hotels.json; then
            echo 'No formatting change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/hotels.json
          git commit -m 'Restore compact hotel JSON formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
