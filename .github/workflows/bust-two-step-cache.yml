name: Apply two-step finder cache version

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bust-two-step-cache.yml

permissions:
  contents: write

jobs:
  update-index-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update only the app script version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = "assets/js/app.js?v=20260802-3"
          new = "assets/js/app.js?v=20260806-2"

          if old not in content:
              raise SystemExit("Expected app.js version was not found; no file was changed.")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit the cache-version change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load two-step finder without stale cache"
          git push
