name: Audit all hotel images

on:
  push:
    branches:
      - audit/all-hotel-image-coverage-20260807
    paths:
      - .github/workflows/audit-all-hotel-images.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/all-hotel-image-coverage-20260807
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit all 1,256 hotel records
        env:
          IMAGE_INTERVAL_MS: "1150"
          AFFILIATE_INTERVAL_MS: "1700"
        run: node scripts/audit-all-hotel-images.mjs
      - name: Save reports and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/all-hotel-image-audit-20260807
          git rm .github/workflows/audit-all-hotel-images.yml
          git commit -m "Complete full hotel image coverage audit"
          git push origin HEAD:audit/all-hotel-image-coverage-20260807
