name: Targeted hotel detail audit patch

on:
  push:
    branches:
      - audit/hotel-details-750-fast-20260808
    paths:
      - .github/workflows/targeted-hotel-detail-audit-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/hotel-details-750-fast-20260808

      - name: Patch only fast-audit targets
        run: python scripts/patch_hotel_detail_audit_targets.py

      - name: Validate target-only diff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          p=json.loads(Path('assets/data/hotel-details.json').read_text(encoding='utf-8'))
          v=json.loads(Path('research/generated/hotel_details_production_validation.json').read_text(encoding='utf-8'))
          assert p['recordCount']==750 and len(p['records'])==750 and len(set(p['records']))==750
          patch=v['targetedAuditPatch']
          assert patch['changedRecordCount']==56
          assert patch['stationFixes']==6
          assert patch['transferCountsHidden']==19
          assert patch['missingHeroDowngradedToLimited']==31
          assert v['coverageCounts']['complete']==641
          assert v['coverageCounts']['limited']==109
          assert v['recordsWithHeroMinutes']==641
          bad={'は三鷹','｢平塚','札駅から大通','｢大阪梅田'}
          for rec in p['records'].values():
              assert rec.get('access',{}).get('venueStation') not in bad
          print('target-only audit patch validated')
          PY

      - name: Commit only patched data and validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/hotel-details.json research/generated/hotel_details_production_validation.json
          git commit -m "Fix only flagged hotel detail audit records"
          git push origin HEAD:audit/hotel-details-750-fast-20260808
