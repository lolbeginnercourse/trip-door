name: Apply manual web route research batch 20260808-01

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - .github/workflows/apply-manual-route-batch-20260808-01.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hotel-details-750-20260807
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply ordinary web search findings
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from datetime import datetime, timezone, timedelta

          p=Path('research/generated/hotel_detail_research_750.jsonl')
          rows=[json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          jst=timezone(timedelta(hours=9))
          checked=datetime.now(jst).isoformat(timespec='seconds')

          U={
            'stage-156-1': dict(
              hotel_nearest_station='金沢', hotel_to_station_walk_min=10,
              venue_nearest_station='本多町（バス停）', venue_station_to_venue_walk_min=1,
              station_to_station_min=20, transfer_count=0, total_access_min=31,
              access_display='金沢歌劇座まで約31分 / JR金沢駅まで徒歩約10分 / 金沢駅から本多町までバス約20分 / 下車徒歩1分',
              verification_status='verified',
              sources=['https://www.hotelforza.jp/kanazawa/access/','https://www.kagekiza.gr.jp/access/index.html','https://mice.jnto.go.jp/organizer-support/search/venue-detail/526.html'],
              note='ホテル公式でJR金沢駅から徒歩約10分。金沢歌劇座公式/JNTOでJR金沢駅から本多町までバス約20分、本多町下車徒歩1分を確認。'),
            'stage-156-2': dict(
              hotel_nearest_station='金沢', hotel_to_station_walk_min=17,
              venue_nearest_station='本多町（バス停）', venue_station_to_venue_walk_min=1,
              station_to_station_min=20, transfer_count=0, total_access_min=38,
              access_display='金沢歌劇座まで約38分 / JR金沢駅まで徒歩約17分 / 金沢駅から本多町までバス約20分 / 下車徒歩1分',
              verification_status='verified',
              sources=['https://www.gardenhotels.co.jp/kanazawa/access/','https://www.kagekiza.gr.jp/access/index.html','https://mice.jnto.go.jp/organizer-support/search/venue-detail/526.html'],
              note='三井ガーデンホテル金沢公式でJR金沢駅から徒歩17分。金沢歌劇座公式/JNTOで金沢駅から本多町までバス約20分、本多町下車徒歩1分。'),
            'stage-156-3': dict(
              hotel_nearest_station='金沢', hotel_to_station_walk_min=18,
              venue_nearest_station='本多町（バス停）', venue_station_to_venue_walk_min=1,
              station_to_station_min=20, transfer_count=0, total_access_min=39,
              access_display='金沢歌劇座まで約39分 / JR金沢駅まで徒歩約18分 / 金沢駅から本多町までバス約20分 / 下車徒歩1分',
              verification_status='verified',
              sources=['https://www.tokyustay.co.jp/hotel/KZ/topics/2020/03/post_11.html','https://map.yahoo.co.jp/v3/place/6rAE4BECWWE','https://www.kagekiza.gr.jp/access/index.html','https://mice.jnto.go.jp/organizer-support/search/venue-detail/526.html'],
              note='東急ステイ公式で金沢駅から最寄り南町・尾山神社までバス約7分＋徒歩1分、地図情報で金沢駅東口から徒歩約18分。歌劇座は金沢駅から本多町までバス約20分＋徒歩1分。'),
            'stage-209-1': dict(
              hotel_nearest_station='新神戸', hotel_to_station_walk_min=1,
              venue_nearest_station='新神戸', venue_station_to_venue_walk_min=0,
              station_to_station_min=0, transfer_count=0, total_access_min=1,
              access_display='AiiA 2.5 Theater Kobeまで約1分相当 / ホテル・劇場とも新神戸駅直結 / 乗換0回',
              verification_status='verified',
              sources=['https://www.anacrowneplaza-kobe.jp/access/','https://aiia-theater.com/','https://kotonohakokobe.jp/shopguide/f2/147/'],
              note='ANAクラウンプラザホテル神戸とAiiA 2.5 Theater Kobeはいずれも新神戸駅直結。駅間移動なし。'),
            'stage-209-2': dict(
              hotel_nearest_station='三ノ宮', hotel_to_station_walk_min=7,
              venue_nearest_station='新神戸', venue_station_to_venue_walk_min=0,
              station_to_station_min=2, transfer_count=0, total_access_min=9,
              access_display='AiiA 2.5 Theater Kobeまで約9分 / JR三ノ宮駅まで徒歩約7分 / 地下鉄で新神戸まで1駅約2分 / 駅直結',
              verification_status='verified',
              sources=['https://www.piena.co.jp/access/','https://aiia-theater.com/','https://www.anacrowneplaza-kobe.jp/access/'],
              note='ホテルピエナ神戸公式でJR三宮駅から徒歩約7分。AiiA公式で新神戸駅直結、三宮から地下鉄1駅。ANAクラウンプラザ公式で三宮→新神戸は地下鉄約2分。'),
            'stage-209-3': dict(
              hotel_nearest_station='新神戸', hotel_to_station_walk_min=15,
              venue_nearest_station='新神戸', venue_station_to_venue_walk_min=0,
              station_to_station_min=0, transfer_count=0, total_access_min=15,
              access_display='AiiA 2.5 Theater Kobeまで約15分 / 神戸北野ホテルから新神戸駅まで徒歩15分 / 駅直結 / 乗換0回',
              verification_status='verified',
              sources=['https://www.kobe-kitanohotel.co.jp/?men=7','https://aiia-theater.com/'],
              note='神戸北野ホテル公式で三宮駅または新神戸駅から徒歩15分。AiiAは新神戸駅直結のため新神戸を共通起点として駅間0分。'),
            'stage-225-1': dict(
              hotel_nearest_station='袋町', hotel_to_station_walk_min=5,
              venue_nearest_station='舟入町', venue_station_to_venue_walk_min=5,
              station_to_station_min=18, transfer_count=1, total_access_min=28,
              access_display='広島文化学園HBGホールまで約28分 / 袋町電停まで徒歩約5分 / 袋町→舟入町 約18分・乗換1回 / 舟入町から徒歩約5分',
              verification_status='verified',
              sources=['https://www.gardenhotels.co.jp/hiroshima/access/','https://transit.yahoo.co.jp/search/result/%E8%88%9F%E5%85%A5%E7%94%BA-%E8%A2%8B%E7%94%BA','https://h-bkk.jp/access/'],
              note='ホテル公式で袋町電停から徒歩約5分。通常の乗換検索で袋町〜舟入町は約18分・乗換1回の経路を確認。HBGホール公式系アクセスで舟入町から徒歩約5分。'),
            'stage-225-2': dict(
              hotel_nearest_station='中電前', hotel_to_station_walk_min=1,
              venue_nearest_station='徒歩直行', venue_station_to_venue_walk_min=0,
              station_to_station_min=None, transfer_count=0, total_access_min=None,
              access_display='広島文化学園HBGホールまで徒歩圏 / ホテルは中電前電停徒歩約1分 / 会場まで約550m',
              verification_status='partial',
              sources=['https://www.daiwaroynet.jp/hiroshima/access/','https://www.cocolocala.jp/spots/63464/hotels','https://h-bkk.jp/access/'],
              note='ホテル公式で中電前徒歩約1分。宿泊施設比較情報でHBGホールからホテルまで約550mを確認。徒歩分数を一次根拠で確定できないため推測せずpartialとする。'),
            'stage-225-3': dict(
              hotel_nearest_station='八丁堀', hotel_to_station_walk_min=3,
              venue_nearest_station='舟入本町', venue_station_to_venue_walk_min=5,
              station_to_station_min=20, transfer_count=0, total_access_min=28,
              access_display='広島文化学園HBGホールまで約28分 / 八丁堀電停まで徒歩約3分 / 八丁堀→舟入本町 約20分・乗換0回 / 会場方面へ徒歩',
              verification_status='verified',
              sources=['https://www.intergatehotels.jp/hiroshima/faq/','https://transit.yahoo.co.jp/search/result/%E5%85%AB%E4%B8%81%E5%A0%80%28%E5%BA%83%E5%B3%B6%E7%9C%8C%29-%E8%88%9F%E5%85%A5%E6%9C%AC%E7%94%BA','https://h-bkk.jp/access/'],
              note='インターゲート公式で八丁堀徒歩約3分。通常乗換検索で八丁堀→舟入本町は約20分・乗換0回。会場公式アクセスでは舟入町側から徒歩約5分のため、徒歩部分は保守的に扱う。'),
            'stage-228-3': dict(
              hotel_nearest_station='呉', hotel_to_station_walk_min=15,
              venue_nearest_station='呉', venue_station_to_venue_walk_min=7,
              station_to_station_min=0, transfer_count=0, total_access_min=22,
              access_display='呉信用金庫ホールまで約22分 / 呉駅まで徒歩約15分 / 駅間移動0分 / 呉駅からホール徒歩約7分',
              verification_status='verified',
              sources=['https://www.clayton-bay.jp/access/','https://www.kure-bunka.jp/?cn=100016'],
              note='クレイトンベイホテルは呉駅徒歩約15分、呉信用金庫ホール公式はJR呉駅徒歩約7分。同一駅のため駅間0分・乗換0回。'),
          }

          found=set()
          for r in rows:
              rid=r.get('id')
              if rid not in U:
                  continue
              found.add(rid)
              u=U[rid]
              # Only convert rows that still have the parser-failure review flag.
              if r.get('verification_status')!='needs_review' or 'transit_parse_failed' not in (r.get('warnings') or []):
                  continue
              for k in ['hotel_nearest_station','hotel_to_station_walk_min','venue_nearest_station','venue_station_to_venue_walk_min','station_to_station_min','transfer_count','total_access_min','access_display','verification_status']:
                  r[k]=u[k]
              warnings=[w for w in (r.get('warnings') or []) if w not in ('transit_parse_failed','hotel_station_differs_from_existing')]
              r['warnings']=warnings
              r['transit_source_url']=u['sources'][-1]
              r['checked_at']=checked
              r['transit_duration_min']=u['station_to_station_min']
              r['manual_route_verification']={
                  'mode':'ordinary_web_search',
                  'checked_at':checked,
                  'source_urls':u['sources'],
                  'transit_duration_min':u['station_to_station_min'],
                  'transfer_count':u['transfer_count'],
                  'note':u['note'],
              }

          missing=set(U)-found
          if missing:
              raise SystemExit(f'Missing target ids: {sorted(missing)}')

          p.write_text('\n'.join(json.dumps(r,ensure_ascii=False,separators=(',',':')) for r in rows)+'\n',encoding='utf-8')

          sc=Counter(r.get('verification_status') for r in rows)
          wc=Counter(w for r in rows for w in (r.get('warnings') or []))
          final={
              'row_count':len(rows),
              'unique_id_count':len({r.get('id') for r in rows}),
              'status_counts':dict(sc),
              'warning_counts':dict(wc),
              'complete':len(rows)==750 and len({r.get('id') for r in rows})==750,
              'verification_mode':'ordinary_web_search_manual_batches',
          }
          Path('research/generated/final_validation.json').write_text(json.dumps(final,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(final,ensure_ascii=False,indent=2))
          PY
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/generated/hotel_detail_research_750.jsonl research/generated/final_validation.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply 10 ordinary web route verifications"
            git push origin HEAD:research/hotel-details-750-20260807
          fi
