name: Test Jalan link research v2

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - .github/workflows/test-jalan-link-research-v2.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hotel-details-750-20260807
      - name: Run 3-row diagnostic v2
        shell: bash
        run: |
          set +e
          python scripts/research_jalan_links_v2.py --start 1 --end 3 --output research/generated/jalan_test_3_v2.csv > research/generated/jalan_test_3_v2.log 2>&1
          RC=$?
          echo "$RC" > research/generated/jalan_test_3_v2.rc
          tail -n 200 research/generated/jalan_test_3_v2.log
          exit 0
      - name: Commit diagnostic files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/jalan_test_3_v2.csv research/generated/jalan_test_3_v2.log research/generated/jalan_test_3_v2.rc 2>/dev/null || true
          git commit -m "Record Jalan research v2 diagnostic" || exit 0
          git push origin HEAD:research/hotel-details-750-20260807
