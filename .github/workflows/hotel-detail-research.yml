name: Research hotel details 750

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - scripts/research_hotel_details.py
      - scripts/repair_transit_routes.py
      - scripts/summarize_hotel_research.py
      - .github/workflows/hotel-detail-research.yml

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair existing 1-25 transit routes
        run: |
          python scripts/repair_transit_routes.py || true
          python scripts/summarize_hotel_research.py || true
      - name: Continue research 26-750 with checkpoints
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for start in $(seq 26 25 726); do
            end=$((start + 24))
            if [ "$end" -gt 750 ]; then end=750; fi
            echo "===== Research batch ${start}-${end} ====="

            set +e
            python scripts/research_hotel_details.py --start "$start" --end "$end" > "research_${start}_${end}.log" 2>&1
            code=$?
            set -e
            if [ "$code" -ne 0 ]; then
              echo "First attempt failed with exit ${code}; retrying batch ${start}-${end}"
              tail -n 120 "research_${start}_${end}.log" || true
              set +e
              python scripts/research_hotel_details.py --start "$start" --end "$end" >> "research_${start}_${end}.log" 2>&1
              code=$?
              set -e
            fi

            python scripts/repair_transit_routes.py >> "research_${start}_${end}.log" 2>&1 || true
            python scripts/summarize_hotel_research.py | tee -a "research_${start}_${end}.log" || true

            python - "$start" "$end" "$code" <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          start,end,code=map(int,sys.argv[1:])
          log=Path(f'research_{start}_{end}.log')
          Path('research/generated/research_run_status.json').write_text(json.dumps({
              'latest_batch_start':start,
              'latest_batch_end':end,
              'latest_exit_code':code,
              'checked_at_utc':datetime.now(timezone.utc).isoformat(),
              'log_tail':log.read_text(encoding='utf-8',errors='ignore')[-16000:] if log.exists() else '',
          },ensure_ascii=False,indent=2),encoding='utf-8')
          PY

            git add -f research/generated/hotel_access_cache.jsonl research/generated/venue_access_cache.jsonl research/generated/hotel_detail_research_750.jsonl research/generated/research_progress.json research/generated/research_run_status.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Hotel detail research checkpoint ${start}-${end}"
              git push
            fi

            echo "===== Finished batch ${start}-${end} ====="
          done

      - name: Final research summary
        if: always()
        run: |
          python scripts/repair_transit_routes.py || true
          python scripts/summarize_hotel_research.py || true
          cat research/generated/research_progress.json || true
          git add -f research/generated/hotel_access_cache.jsonl research/generated/venue_access_cache.jsonl research/generated/hotel_detail_research_750.jsonl research/generated/research_progress.json research/generated/research_run_status.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Finalize hotel detail research collection"
            git push
          fi
