name: Export final Jalan CSV chunks

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - .github/workflows/export-final-jalan-csv-chunks.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hotel-details-750-20260807
      - name: Compress and split final CSV
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          src=Path('research/generated/jalan_links_750_final.csv')
          raw=src.read_bytes()
          gz=gzip.compress(raw,compresslevel=9)
          b64=base64.b64encode(gz).decode('ascii')
          out=Path('research/generated/jalan_export_chunks'); out.mkdir(parents=True,exist_ok=True)
          for p in out.glob('part_*.txt'): p.unlink()
          size=7000
          parts=[b64[i:i+size] for i in range(0,len(b64),size)]
          for i,s in enumerate(parts): (out/f'part_{i:02d}.txt').write_text(s,encoding='ascii')
          meta={'parts':len(parts),'base64_chars':len(b64),'gzip_bytes':len(gz),'raw_bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()}
          (out/'meta.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8')
          print(meta)
          PY
      - name: Commit export chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/jalan_export_chunks
          git commit -m "Export final Jalan CSV as transfer chunks" || exit 0
          git push origin HEAD:research/hotel-details-750-20260807
