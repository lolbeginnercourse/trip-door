name: Test and finalize Rakuten image fallback

on:
  push:
    branches:
      - agent/rakuten-image-search-fallback-20260807
    paths:
      - .github/workflows/finalize-rakuten-image-fallback.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rakuten-image-search-fallback-20260807
      - name: Update browser cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/js/hotel-images.js?v=20260807-1'
          new = 'assets/js/hotel-images.js?v=20260807-2'
          if old not in text and new not in text:
              raise SystemExit('hotel image script marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Check syntax and fallback matching
        shell: bash
        run: |
          node --check api/hotel-image.js
          node --check assets/js/hotel-images.js
          node <<'NODE'
          process.env.RAKUTEN_APPLICATION_ID = 'test-app';
          process.env.RAKUTEN_ACCESS_KEY = 'test-key';
          const requests = [];
          global.fetch = async input => {
            const url = new URL(String(input));
            requests.push(url.searchParams.get('keyword') || `hotelNo:${url.searchParams.get('hotelNo')}`);
            const keyword = url.searchParams.get('keyword');
            const hotels = keyword === '青物横丁'
              ? [{ hotelBasicInfo: {
                  hotelNo: 69219,
                  hotelName: '高濃度炭酸泉 銀杏の湯 スーパーホテル品川・青物横丁',
                  address1: '東京都',
                  address2: '品川区東品川3-22-27',
                  nearestStation: '青物横丁',
                  access: '京急本線 青物横丁駅より徒歩約6分',
                  hotelImageUrl: 'https://example.r10s.jp/hotel.jpg',
                  hotelThumbnailUrl: 'https://example.r10s.jp/thumb.jpg'
                }}]
              : [];
            return { ok: true, json: async () => ({ hotels }) };
          };
          const handler = require('./api/hotel-image.js');
          const req = {
            method: 'GET',
            query: {
              name: 'スーパーホテル品川・青物横丁',
              prefecture: '東京都',
              area: '天王洲アイル',
              station: '青物横丁',
              matchVersion: '2'
            },
            headers: {},
            socket: { remoteAddress: '127.0.0.1' }
          };
          let statusCode = 0;
          let body = null;
          const res = {
            setHeader() {},
            end(value) { body = JSON.parse(value); },
            set statusCode(value) { statusCode = value; },
            get statusCode() { return statusCode; }
          };
          Promise.resolve(handler(req, res)).then(() => {
            if (statusCode !== 200) throw new Error(`expected 200, got ${statusCode}`);
            if (!body?.image?.src) throw new Error('expected image');
            if (body.image.hotelNo !== '69219') throw new Error('unexpected hotel number');
            if (body.image.matchedBy !== 'containedNameLocation') throw new Error(`unexpected match mode: ${body.image.matchedBy}`);
            if (!requests.includes('青物横丁')) throw new Error('station fallback was not used');
            console.log('fallback matching test passed');
          }).catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/finalize-rakuten-image-fallback.yml
          git commit -m "Finalize Rakuten image search fallback"
          git push origin HEAD:agent/rakuten-image-search-fallback-20260807
