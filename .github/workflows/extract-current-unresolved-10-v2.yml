name: Extract current unresolved route batch v2

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - .github/workflows/extract-current-unresolved-10-v2.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hotel-details-750-20260807
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract first 10 unresolved rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('research/generated/hotel_detail_research_750.jsonl')
          rows=[]
          for line in src.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              r=json.loads(line)
              if r.get('verification_status')=='needs_review' and 'transit_parse_failed' in (r.get('warnings') or []):
                  rows.append(r)
          compact=[]
          keep=['research_no','id','hotel_name','venue_name','prefecture','area','hotel_nearest_station','hotel_to_station_walk_min','hotel_source_url','venue_nearest_station','venue_station_to_venue_walk_min','venue_source_url','station_to_station_min','transfer_count','access_display','warnings']
          for r in rows[:10]:
              compact.append({k:r.get(k) for k in keep})
          payload={'remaining_count':len(rows),'batch':compact}
          Path('research/generated/current_unresolved_10_min.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(payload,ensure_ascii=False))
          PY
      - name: Commit extracted batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/generated/current_unresolved_10_min.json
          if ! git diff --cached --quiet; then
            git commit -m "Extract compact unresolved route batch"
            git push origin HEAD:research/hotel-details-750-20260807
          fi
