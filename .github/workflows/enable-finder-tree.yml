name: Enable destination tree menu

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/enable-finder-tree.yml

permissions:
  contents: write

jobs:
  enable-tree-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add tree script and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = '  <script src="assets/js/app.js?v=20260806-4" defer></script>'
          new = old + '\n  <script src="assets/js/finder-tree.js?v=20260806-1" defer></script>'

          if 'assets/js/finder-tree.js?v=20260806-1' in content:
              raise SystemExit("Tree script is already enabled.")
          if old not in content:
              raise SystemExit("Expected app.js script tag was not found.")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

          node --check assets/js/finder-tree.js

      - name: Commit final files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-finder-tree.yml
          git add index.html
          git commit -m "Enable tree menu for destination field"
          git push
