name: Extract unresolved Jalan rows

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - .github/workflows/extract-jalan-unresolved.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/hotel-details-750-20260807
      - name: Extract unresolved rows
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=Path('research/generated/jalan_links_750_v3.csv')
          with src.open(encoding='utf-8',newline='') as f:
              rows=list(csv.DictReader(f))
          rows=[r for r in rows if r['verification_status'] not in ('verified','verified_fuzzy')]
          fields=['research_no','id','hotel_name','prefecture','area','station','venueId','venue_name','verification_status','candidate_url','jalan_hotel_name','name_similarity','prefecture_match','station_match','verification_note','search_url']
          out=Path('research/generated/jalan_unresolved_53.csv')
          with out.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,extrasaction='ignore'); w.writeheader(); w.writerows(rows)
          print('rows',len(rows))
          if len(rows)!=53: raise SystemExit(f'expected 53 unresolved, got {len(rows)}')
          PY
      - name: Commit unresolved extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/jalan_unresolved_53.csv
          git commit -m "Extract 53 unresolved Jalan rows" || exit 0
          git push origin HEAD:research/hotel-details-750-20260807
