name: Publish finalized single-select finder

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bust-single-select-cache.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update cache version and remove temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          content = path.read_text(encoding="utf-8")
          old = "assets/js/app.js?v=20260806-3"
          new = "assets/js/app.js?v=20260806-4"

          if old not in content:
              raise SystemExit("Expected app.js version was not found; no file was changed.")

          path.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY

          node --check assets/js/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bust-single-select-cache.yml
          git rm -f .github/workflows/fix-single-select-runtime.yml
          git add index.html
          git commit -m "Publish finalized single-select finder"
          git push
