name: Full hotel image audit PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  audit:
    if: github.head_ref == 'audit/all-hotel-image-coverage-20260807'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/all-hotel-image-coverage-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Process next audit chunk
        env:
          IMAGE_CHUNK_SIZE: '25'
          AFFILIATE_CHUNK_SIZE: '15'
          IMAGE_INTERVAL_MS: '1150'
          AFFILIATE_INTERVAL_MS: '1700'
        run: node scripts/audit-all-hotel-images-chunk.mjs
      - name: Save checkpoint
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/all-hotel-image-audit-20260807
          git rm -f .github/workflows/audit-all-hotel-images.yml || true
          if git diff --cached --quiet; then
            echo 'No new audit progress to save.'
            exit 0
          fi
          PHASE=$(node -e "const p=require('./reports/all-hotel-image-audit-20260807/progress.json'); console.log(p.phase)")
          IMAGE_INDEX=$(node -e "const p=require('./reports/all-hotel-image-audit-20260807/progress.json'); console.log(p.nextImageIndex || 0)")
          AFFILIATE_INDEX=$(node -e "const p=require('./reports/all-hotel-image-audit-20260807/progress.json'); console.log(p.nextAffiliateIndex || 0)")
          git commit -m "Continue hotel image audit: ${PHASE} image-${IMAGE_INDEX} affiliate-${AFFILIATE_INDEX}"
          git push origin HEAD:audit/all-hotel-image-coverage-20260807
