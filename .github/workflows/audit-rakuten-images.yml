name: Audit Rakuten hotel images

on:
  push:
    branches:
      - agent/rakuten-image-audit-20260806
    paths:
      - scripts/audit-rakuten-images.mjs
      - .github/workflows/audit-rakuten-images.yml
      - assets/data/hotels.json

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
      RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
      RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4
        with:
          ref: agent/rakuten-image-audit-20260806

      - name: Run strict duplicate audit
        run: node scripts/audit-rakuten-images.mjs assets/data/hotels.json reports/rakuten-image-audit.json

      - name: Commit audit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/rakuten-image-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "Record Rakuten image audit"
          git push origin HEAD:agent/rakuten-image-audit-20260806
