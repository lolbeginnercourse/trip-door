name: Extract hotel research manifest

on:
  push:
    branches:
      - research/hotel-details-750-20260807
    paths:
      - scripts/extract_hotel_research_manifest.py
      - .github/workflows/extract-hotel-research.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract source records
        run: python scripts/extract_hotel_research_manifest.py
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/generated/hotel_structure.json research/generated/hotel_records.jsonl research/generated/hotel_key_inventory.jsonl
          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git commit -m "Generate hotel research manifest"
          git push
