name: Hotel detail PR integration build

on:
  pull_request:
    branches:
      - feature/hotel-detail-research-20260808
    paths:
      - .hotel-detail-build-trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feature/hotel-detail-research-20260808
          fetch-depth: 0

      - name: Fetch final 750-row research dataset
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/hotel-details-750-20260807 --depth=1
          git show origin/research/hotel-details-750-20260807:research/generated/hotel_detail_research_750.jsonl > /tmp/hotel_detail_research_750.jsonl
          test "$(wc -l < /tmp/hotel_detail_research_750.jsonl)" -eq 750

      - name: Build production detail data
        run: |
          python scripts/build_hotel_details_production.py \
            --research /tmp/hotel_detail_research_750.jsonl \
            --hotels assets/data/hotels.json \
            --output assets/data/hotel-details.json \
            --validation research/generated/hotel_details_production_validation.json

      - name: Apply UI integration
        run: python scripts/apply_hotel_detail_integration.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/app.js
          node --check assets/js/hotel-detail.js
          python -m py_compile scripts/build_hotel_details_production.py scripts/apply_hotel_detail_integration.py
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('assets/data/hotel-details.json').read_text(encoding='utf-8'))
          validation = json.loads(Path('research/generated/hotel_details_production_validation.json').read_text(encoding='utf-8'))
          records = payload.get('records') or {}
          assert payload.get('recordCount') == 750
          assert len(records) == 750 and len(set(records)) == 750
          assert validation['researchRows'] == 750
          assert validation['researchUniqueIds'] == 750
          assert validation['researchStatusCounts'].get('verified', 0) == 672, validation['researchStatusCounts']
          assert validation['researchStatusCounts'].get('partial', 0) == 78, validation['researchStatusCounts']
          assert validation['researchStatusCounts'].get('needs_review', 0) == 0
          assert validation['coverageCounts'].get('complete', 0) == 672
          assert validation['coverageCounts'].get('limited', 0) == 78
          assert not validation['missingBaseHotelIds']
          serialized = json.dumps(payload, ensure_ascii=False)
          assert 'verification_status' not in serialized
          assert '"warnings"' not in serialized
          for item in records.values():
              assert item.get('checkedAt')
              if item.get('coverage') == 'limited':
                  assert item.get('access', {}).get('heroMin') is None
          app = Path('assets/js/app.js').read_text(encoding='utf-8')
          detail = Path('assets/js/hotel-detail.js').read_text(encoding='utf-8')
          css = Path('assets/css/hotel-detail.css').read_text(encoding='utf-8')
          assert 'hotel-detail.css?v=20260808-1' in app
          assert 'hotel-detail.js?v=20260808-1' in app
          assert 'hd-access-facts' in detail and 'hd-access-facts' in css
          assert 'detail-visual' not in detail
          print(json.dumps(validation, ensure_ascii=False, indent=2))
          PY

      - name: Commit validated files to implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/app.js assets/js/hotel-detail.js assets/css/hotel-detail.css assets/data/hotel-details.json research/generated/hotel_details_production_validation.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate validated 750 hotel detail records"
          git push origin HEAD:feature/hotel-detail-research-20260808
