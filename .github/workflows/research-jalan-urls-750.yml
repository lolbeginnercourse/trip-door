name: Research Jalan URLs 750

on:
  push:
    branches:
      - export/booking-urls-750-20260808
    paths:
      - scripts/research_jalan_urls_750.py
      - .github/workflows/research-jalan-urls-750.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-jalan-urls-750
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: export/booking-urls-750-20260808
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Research Jalan hotel URLs
        run: python scripts/research_jalan_urls_750.py
      - name: Validate output
        run: |
          python - <<'PY'
          import csv, json
          with open('exports/jalan_urls_750_researched.csv', encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==750, len(rows)
          print('rows', len(rows), 'with_url', sum(bool(r['jalan_url']) for r in rows))
          print(open('exports/jalan_urls_750_research_summary.json', encoding='utf-8').read())
          PY
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add exports/jalan_urls_750_researched.csv exports/jalan_hotel_url_map.json exports/jalan_urls_unresolved.csv exports/jalan_urls_750_research_summary.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Research Jalan URLs for 750 hotel rows'
            git push origin HEAD:export/booking-urls-750-20260808
          fi
